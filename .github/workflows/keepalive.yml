name: Render 保活

# Render 免费 Web Service 闲置 15 分钟会休眠，下次打开需等 30~60 秒冷启动。
# 这个工作流每 10 分钟访问一次 /healthz，让实例保持清醒。
# 免费额度每月 750 实例小时，单服务常驻约 730 小时，刚好够用。
#
# 若服务名不是 xixi-club，请在仓库 Settings → Secrets and variables → Actions
# → Variables 里新建变量 SERVICE_URL，值填完整地址，例如：
#   https://你的服务名.onrender.com

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 访问 /healthz
        run: |
          URL="${{ vars.SERVICE_URL }}"
          if [ -z "$URL" ]; then
            URL="https://xixi-club.onrender.com"
            echo "未设置 SERVICE_URL，使用默认地址：$URL"
          fi

          URL="${URL%/}/healthz"
          echo "正在唤醒：$URL"

          # 冷启动最长约 60 秒，放宽超时并重试
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' \
              --max-time 90 --connect-timeout 20 "$URL" || echo 000)
            echo "第 $i 次尝试 → HTTP $code · $(cat /tmp/body 2>/dev/null | head -c 120)"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done

          echo "::warning::服务未在预期时间内响应，可能是实例额度用尽或部署失败"
          exit 0
