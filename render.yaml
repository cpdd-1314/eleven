# Render Blueprint —— 一键部署「十一愿俱乐部」网站版
# 用法：Render Dashboard → New → Blueprint → 选择本仓库 → Apply
# 会自动创建：1 个 Node Web Service + 1 个 PostgreSQL 数据库，并自动注入 DATABASE_URL

services:
  - type: web
    name: xixi-club
    runtime: node
    plan: free
    region: singapore          # 国内访问相对较快；也可改成 oregon / frankfurt
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: xixi-club-db
          property: connectionString
      # 访问口令：部署时在 Render 里手填（不要写进代码库）
      - key: ACCESS_CODE
        sync: false
      # 会话签名密钥：Render 自动生成随机值
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: xixi-club-db
    databaseName: xixi_club
    user: xixi
    plan: free
    region: singapore
